[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ometa-diff"
version = "0.1.0b1"
description = "MCP server adding metadata version-diff intelligence to OpenMetadata"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
keywords = ["openmetadata", "metadata", "diff", "changelog", "mcp", "data-catalog"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0,<3.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0.0"]
dev = ["pytest>=8.0.0", "ruff>=0.5.0", "respx>=0.21.0"]

[project.scripts]
ometa-diff = "ometa_diff.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ometa_diff"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
